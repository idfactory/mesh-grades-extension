name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: npm test
      - name: Build installable ZIP
        run: python3 scripts/package_extension.py "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/mesh-grades-extension-${GITHUB_REF_NAME#v}.zip#Установочный ZIP расширения" \
            --verify-tag \
            --title "Успеваемость ребенка $GITHUB_REF_NAME" \
            --notes "Для установки скачайте mesh-grades-extension-${GITHUB_REF_NAME#v}.zip. Ссылки Source code (zip) и Source code (tar.gz) GitHub добавляет автоматически: это исходники репозитория, а не установочный архив расширения." \
            --generate-notes
